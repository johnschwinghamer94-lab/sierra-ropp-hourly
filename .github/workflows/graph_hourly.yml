name: Cloud hourly (live API · Graph fallback)
on:
  schedule:
    # Every 15 min, 9 AM–11 PM PT. GitHub often skips single hourly ticks on
    # low-traffic private repos, so run 4x/hour to reliably catch each hour
    # (idempotent — re-runs just refresh the current hour's counts).
    - cron: "*/15 16-23,0-6 * * *"
  workflow_dispatch:
concurrency:
  group: graph-hourly
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles   # date.today() must be VEGAS-today — UTC rolls over at
                                # 5 PM PT and made the Yesterday tab show today every evening
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --quiet -r requirements.txt
      - env:
          ST_CREDS_JSON: ${{ secrets.ST_CREDS_JSON }}   # today's reports live from ServiceTitan
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_REFRESH_TOKEN: ${{ secrets.GRAPH_REFRESH_TOKEN }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        # John 2026-07-26: near-live Today tab with no machine on — capture
        # every ~3 min for the whole heartbeat window. cron-job.org fires the
        # next dispatch each quarter-hour; the concurrency group queues it
        # until this loop finishes, so the chain is continuous.
        run: |
          # A single failed capture is harmless — the next one 150s later re-reads the
          # same hour. ALL FIVE failing is not: hourly.json never advances and the
          # dashboard Today tab quietly freezes on the last good hour, which is exactly
          # the kind of stall that used to hide behind `|| echo ... continuing`.
          fails=0
          for i in 1 2 3 4 5; do
            python graph_hourly.py || { echo "::warning::hourly capture $i/5 failed — a later capture in this run can still refresh the hour"; fails=$((fails+1)); }
            if [ "$i" -lt 5 ]; then sleep 150; fi
          done
          if [ "$fails" -ge 5 ]; then
            echo "::error::all 5 hourly captures failed — hourly.json did NOT advance, so the dashboard Today tab is frozen at its last good hour"
            exit 1
          fi
          [ "$fails" -eq 0 ] || echo "::warning::$fails of 5 hourly captures failed (a later one succeeded, so Today is current)"
      # This job is driven dependably 24/7 by cron-job.org, so it doubles as the
      # heartbeat that keeps a SILO Live Feed relay session armed during ops
      # hours — GitHub's own cron skipped all three evening ticks on day one
      # and the live board sat stale for 2.5 h. Extra dispatches are harmless:
      # livefeed.yml's concurrency group collapses pending duplicates.
      - name: Arm SILO Live Feed relay (6a–midnight PT)
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          # extended to midnight 2026-07-26 (John) — late-typed TGL tickets must count on the day's board
          H=$(TZ=America/Los_Angeles date +%-H)
          if [ "$H" -ge 6 ] && [ "$H" -lt 24 ]; then
            # only arm when a spare is not already waiting - extra dispatches
            # replace the queued run and litter Actions with cancelled noise
            API="https://api.github.com/repos/${{ github.repository }}/actions/workflows/livefeed.yml"
            AUTH="Authorization: token $DASHBOARD_TOKEN"
            A=$(curl -s -H "$AUTH" "$API/runs?status=in_progress&per_page=1" | jq '.total_count')
            W=$(curl -s -H "$AUTH" "$API/runs?status=queued&per_page=1" | jq '.total_count')
            if [ "${A:-0}" -ge 1 ] && [ "${W:-0}" -ge 1 ]; then
              echo "livefeed active with a spare queued - no arm needed"
            else
              # The old form only PRINTED the HTTP code, so an expired DASHBOARD_TOKEN
              # (or any 4xx/5xx) stopped arming the relay while this step stayed green —
              # the live board just quietly stopped updating.
              code=""
              for attempt in 1 2 3; do
                code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                  -H "$AUTH" -H "Accept: application/vnd.github+json" \
                  "$API/dispatches" -d '{"ref":"main"}')
                echo "arm livefeed attempt $attempt -> HTTP $code"
                case "$code" in 2*) break ;; esac
                sleep 5
              done
              case "$code" in
                2*) ;;
                *) echo "::error::could not dispatch livefeed.yml (HTTP $code) — the SILO Live Feed relay is no longer being armed, so the live board will stop updating until this is fixed"; exit 1 ;;
              esac
            fi
          else
            echo "outside ops hours (PT hour $H) — skip"
          fi
      # Same heartbeat arms the Siro transcript pull on the :00/:30 ticks (John's
      # 30-min cadence) — siro_pull's own GitHub cron fired 1 of 12 slots on
      # 2026-07-17 morning. siro_pull.yml's concurrency group collapses any
      # overlap with a late native-cron firing.
      - name: Arm Siro transcript pull (6a–midnight PT, every quarter-hour tick)
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          H=$(TZ=America/Los_Angeles date +%-H)
          # minute gate removed 2026-07-26: the capture loop makes each job ~15
          # min long, so this step already fires once per quarter-hour window.
          # extended to midnight 2026-07-26 (John) — late calls need transcripts
          # pulled for scoring/coaching too.
          if [ "$H" -ge 6 ] && [ "$H" -lt 24 ]; then
            # check the HTTP code — a printed 401/404 used to scroll by unnoticed while
            # transcript pulls silently stopped (siro_pull's own cron is unreliable, so
            # this dispatch IS the transcript pipeline's trigger).
            code=""
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: token $DASHBOARD_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/siro_pull.yml/dispatches \
                -d '{"ref":"main"}')
              echo "arm siro_pull attempt $attempt -> HTTP $code"
              case "$code" in 2*) break ;; esac
              sleep 5
            done
            case "$code" in
              2*) ;;
              *) echo "::error::could not dispatch siro_pull.yml (HTTP $code) — Siro transcripts are no longer being pulled, so scoring and coaching plans will run on an ever-staler set of calls"; exit 1 ;;
            esac
          else
            echo "skip (outside 6a-midnight PT)"
          fi
