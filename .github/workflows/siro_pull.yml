name: Siro transcript pull (cloud)
on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Historical backfill lookback (days). Leave blank for the normal LOOKBACK_DAYS constant."
        required: false
        type: string
        default: ""
  schedule:
    # BACKUP ONLY — GitHub's cron fired 1 of 12 slots on 2026-07-17 morning.
    # The dependable trigger is graph_hourly.yml's cron-job.org heartbeat, which
    # dispatches this workflow on the :00/:30 ticks, 6a–10p PT.
    # Every ~30 min during Vegas work hours (6:00 AM – 12:07 AM PT = 13:00–07:07 UTC),
    # off the :00/:30 marks. Verified working via dispatch on 2026-07-17 (run #6).
    # extended to cover through midnight PT 2026-07-26 (John) — late-typed TGL
    # tickets must count on the day's board.
    - cron: "7,37 13-23 * * *"
    - cron: "7,37 0-7 * * *"
concurrency:
  group: siro-pull        # a late cron firing + a dispatch must not race the
  cancel-in-progress: false   # state commit; extra queued runs collapse to one
permissions:
  contents: write   # allow committing the updated siro_pull_state.json back
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --quiet -r requirements.txt
      - name: Pull finished Siro recordings and upload transcripts to OneDrive
        env:
          SIRO_API_KEY: ${{ secrets.SIRO_API_KEY }}
          SIRO_CLIENT_ID: ${{ secrets.SIRO_CLIENT_ID }}
          SIRO_CLIENT_SECRET: ${{ secrets.SIRO_CLIENT_SECRET }}
          SIRO_USER_ID: ${{ secrets.SIRO_USER_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_REFRESH_TOKEN: ${{ secrets.GRAPH_REFRESH_TOKEN }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.lookback_days }}" ]; then
            export SIRO_LOOKBACK_DAYS="${{ github.event.inputs.lookback_days }}"
          fi
          python siro_cloud_pull.py
      - name: Commit + push updated state (retry once after pull --rebase)
        run: |
          git config user.email "johnschwinghamer94@gmail.com"
          git config user.name "John Schwinghamer"
          git add siro_pull_state.json
          [ -d transcripts ] && git add transcripts/
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -q -m "Siro cloud pull state $(date -u +%F' '%H:%M)"
          # Push with conflict healing: parallel pulls also rewrite
          # siro_pull_state.json, and a rebase conflict there used to abort the
          # whole push, LOSING every transcript in this run (2026-07-28, a
          # 1,494-file January backfill died this way). State is safely
          # re-derivable (the puller skips transcripts that already exist on
          # disk), so on conflict keep the REMOTE state file and our transcripts.
          n=0
          until git push -q origin main; do
            n=$((n+1)); [ "$n" -gt 3 ] && { echo "push failed after 3 heals"; exit 1; }
            if ! git pull --rebase --autostash -q; then
              git checkout --ours siro_pull_state.json 2>/dev/null || true
              git add siro_pull_state.json 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
          done
