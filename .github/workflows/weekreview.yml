name: Service Dashboard Week Review (cloud)
on:
  schedule:
    # Sunday 8:30 PM PT (03:30 UTC Monday) -> prelim pass for the week just ending
    - cron: "30 3 * * 1"
    # Monday 6:00 AM PT (13:00 UTC Monday) -> final re-audit vs Sunday's prelim
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "SILO history backfill: first Monday to rebuild (YYYY-MM-DD). Blank = normal weekly run."
        required: false
        default: ""
      overwrite:
        description: "Backfill only — rebuild weeks already on record instead of skipping them"
        type: boolean
        required: false
        default: false
      recompute:
        description: "Rebuild the SILO records/ranks block from the weeks already on file (no report fetches)"
        type: boolean
        required: false
        default: false
concurrency:
  group: weekreview
  cancel-in-progress: false
jobs:
  weekreview:
    runs-on: ubuntu-latest
    # A backfill walks one week at a time through the Reporting API; 20 min covers the
    # weekly run but not a season of history, and a timeout mid-backfill wastes the
    # whole pull. The normal run still finishes in ~2 min regardless of this ceiling.
    timeout-minutes: 90
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet -r requirements.txt
      - name: Service week review (skipped during a SILO backfill)
        if: ${{ github.event.inputs.backfill_from == '' && github.event.inputs.recompute != 'true' }}
        env:
          ST_CREDS_JSON: ${{ secrets.ST_CREDS_JSON }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          SERVICEDATA_CLOUD: "1"
        run: python service_data.py --week-review
      - name: SILO week review — weekly run or history backfill
        env:
          ST_CREDS_JSON: ${{ secrets.ST_CREDS_JSON }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          SERVICEDATA_CLOUD: "1"
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
          OVERWRITE: ${{ github.event.inputs.overwrite }}
          RECOMPUTE: ${{ github.event.inputs.recompute }}
        run: |
          if [ "$RECOMPUTE" = "true" ]; then
            python ropp_week_review.py --recompute
          elif [ -n "$BACKFILL_FROM" ]; then
            EXTRA=""
            [ "$OVERWRITE" = "true" ] && EXTRA="--overwrite"
            python ropp_week_review.py --backfill-from "$BACKFILL_FROM" $EXTRA
          else
            python ropp_week_review.py --week-review
          fi
