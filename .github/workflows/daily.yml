name: Cloud rebuild (hourly · live API)
on:
  schedule:
    - cron: "20 8-15 * * *"   # overnight backup; daytime runs dispatched hourly
  workflow_dispatch:
permissions:
  contents: write            # allow the refresher to commit cancel_dup_exclusions.json back
jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles   # date.today() must be VEGAS-today — UTC rolls over at
                                # 5 PM PT and made the Yesterday tab show today every evening
    steps:
      - uses: actions/checkout@v4          # engine (this private repo)
      - uses: actions/checkout@v4          # live site (public repo)
        with:
          repository: johnschwinghamer94-lab/sierra-ropp-dashboard
          token: ${{ secrets.DASHBOARD_TOKEN }}
          path: site
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --quiet -r requirements.txt
      - name: Preflight — cancellation exclusion + markup intact (fail fast on stale push)
        run: python preflight_check.py
      - name: Fetch reports — ServiceTitan API (fallback to OneDrive Excel)
        env:
          ST_CREDS_JSON: ${{ secrets.ST_CREDS_JSON }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_REFRESH_TOKEN: ${{ secrets.GRAPH_REFRESH_TOKEN }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          if python cloud_fetch.py; then
            echo "ROPP_SOURCE=api" >> "$GITHUB_ENV"
            echo "OK — fetched ROPP reports from the ServiceTitan Reporting API"
          else
            # Real fallback (Excel still produces a correct build), but it must be LOUD:
            # ROPP_SOURCE stays unset, which is exactly what silently broke tgl_conv.py
            # for nine days. If this warning appears every run, the API path is dead.
            echo "::warning::ServiceTitan API fetch FAILED — this build fell back to the emailed OneDrive Excel reports. Numbers are only as fresh as this morning's email, and every API-only extra (TGL conversion truth) may be stale."
            python graph_download_cloud.py
          fi
      - name: TGL ground truth (trailing 8 days)
        continue-on-error: true          # a truth-refresh failure never breaks the rebuild
        env:
          ST_CREDS_JSON: ${{ secrets.ST_CREDS_JSON }}
          # tgl_conv.py reads the cached API payloads via ropp_live when this is set.
          # Without it, it looked for OneDrive Excel exports that this job stopped
          # producing — it failed every run from 2026-07-28 and the `|| echo` below
          # hid it, so conv.json went stale and coaching plans silently fell back to
          # "close rate from graded calls" instead of real ServiceTitan conversion.
          ROPP_SOURCE: api
        run: |
          truth_ok=1
          python tgl_truth.py || { echo "::error::tgl_truth.py failed — daily truth files will be stale"; truth_ok=0; }
          python tgl_conv.py  || { echo "::error::tgl_conv.py failed — coaching close rates will fall back to graded-call sampling"; truth_ok=0; }
          python - <<'PYEOF'
          # Objection mining needs a source-job# -> ScheduledDate map spanning the whole
          # YTD flip history. cache/tgls_created.json is written earlier in this job by
          # cloud_fetch.py; JobNumber there is the SOURCE call job number.
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          cache_file = Path("cache/tgls_created.json")
          if not cache_file.exists():
              print("cache/tgls_created.json missing — skipping ytd_sources.json")
          else:
              rows = json.loads(cache_file.read_text())
              if isinstance(rows, dict):
                  rows = rows.get("rows") or rows.get("data") or []
              sources = {}
              for row in rows:
                  job = str(row.get("JobNumber") or "").strip()
                  sched = row.get("ScheduledDate") or ""
                  if len(job) < 6 or not job.isdigit():
                      continue
                  date_part = str(sched)[:10]
                  if len(date_part) != 10:
                      continue
                  sources[job] = date_part
              out_dir = Path("tgl_truth")
              out_dir.mkdir(exist_ok=True)
              out = {
                  "generated": datetime.now(timezone.utc).isoformat(),
                  "sources": sources,
              }
              (out_dir / "ytd_sources.json").write_text(json.dumps(out, indent=2))
              print(f"wrote tgl_truth/ytd_sources.json with {len(sources)} source jobs")
          PYEOF
          git config user.email "johnschwinghamer94@gmail.com"
          git config user.name "John Schwinghamer"
          git add tgl_truth/
          if git diff --cached --quiet; then
            echo "no TGL truth change"
          else
            git commit -m "TGL truth $(date -u +'%F %H:%M')"
            # Heal push races instead of silently dropping the truth update —
            # the old "|| echo push skipped" lost EVERY update once concurrent
            # commits made the rebase conflict (found 2026-07-28: daily truth
            # files silently stopped for 2 days). Truth files are regenerated
            # fresh each run, so on conflict OUR copies win.
            # Freshly generated truth files are authoritative, so on a push race just
            # rebuild the commit on top of the new remote head and retry. The old
            # rebase/abort dance dropped the commit outright and lost the update.
            n=0
            until git push -q origin main; do
              n=$((n+1))
              if [ "$n" -gt 5 ]; then
                echo "::error::TGL truth push failed after 5 attempts — truth data is stale on main"
                truth_ok=0
                break
              fi
              # --mixed, NOT --soft: --soft leaves the index holding OUR whole
              # old tree, so the retry commit silently REVERTS whatever another
              # job pushed meanwhile (verified: a concurrent siro_pull commit lost
              # its state file and its transcripts). --mixed resets the index to
              # the new remote head, so re-adding only tgl_truth/ means our fresh
              # truth files win and every other remote change is preserved.
              git fetch -q origin main
              git reset -q --mixed origin/main
              git add tgl_truth/
              if git diff --cached --quiet; then echo "truth already current on remote"; break; fi
              git commit -q -m "TGL truth $(date -u +'%F %H:%M')"
            done
          fi
          [ "$truth_ok" = "1" ] || exit 1  # surface masked failures (step is continue-on-error, job still proceeds)

      - name: Refresh duplicate-ticket exclusions (once daily · 14:00 UTC)
        continue-on-error: true          # a refresher failure keeps the last good list; never breaks the build
        env:
          ST_CREDS_JSON: ${{ secrets.ST_CREDS_JSON }}
        run: |
          # The true-dup scan makes ~200 API calls, so run it once a day (after cloud_fetch
          # materialized creds) — plus on any manual run. Other hourly builds reuse the
          # committed cancel_dup_exclusions.json.
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$(date -u +%H)" != "14" ]; then
            echo "hourly rebuild — dup-exclusion refresh runs at 14:00 UTC only; skipping"
            exit 0
          fi
          dup_ok=1
          # creds only — output suppressed, but a failure here is why the refresher
          # below usually dies, so say so instead of `|| true`-ing it into silence.
          python cloud_fetch.py >/dev/null 2>&1 \
            || echo "::warning::cloud_fetch credential re-materialization failed — refresh_dup_exclusions.py may not be able to authenticate"
          if python refresh_dup_exclusions.py; then
            git config user.email "johnschwinghamer94@gmail.com"
            git config user.name "John Schwinghamer"
            git add cancel_dup_exclusions.json
            if git diff --cached --quiet; then
              echo "dup-exclusion list unchanged"
            else
              git commit -q -m "Refresh cancel duplicate-exclusions ($(date -u +%F))"
              # Same push-race heal as the TGL truth step: the old
              # `git push || echo "push skipped"` reported success while the
              # refreshed list never left the runner.
              n=0
              until git push -q origin main; do
                n=$((n+1))
                if [ "$n" -gt 5 ]; then
                  echo "::error::cancel duplicate-exclusion push failed after 5 attempts — the dashboard keeps the OLD exclusion list, so duplicate cancel tickets created since then are counted as real cancellations"
                  dup_ok=0
                  break
                fi
                git fetch -q origin main
                git reset -q --mixed origin/main      # see TGL step: --soft would revert other jobs' pushes
                git add cancel_dup_exclusions.json
                if git diff --cached --quiet; then echo "exclusions already current on remote"; break; fi
                git commit -q -m "Refresh cancel duplicate-exclusions ($(date -u +%F))"
              done
            fi
          else
            echo "::error::refresh_dup_exclusions.py failed — cancel_dup_exclusions.json is FROZEN at its last good state; duplicate cancel tickets created since then will inflate the cancellation numbers on the dashboard"
            dup_ok=0
          fi
          [ "$dup_ok" = "1" ] || exit 1   # step is continue-on-error: job proceeds, step renders red
      - name: Rebuild index.html and push
        env:
          ROPP_REPO: ${{ github.workspace }}/site
        run: |
          git -C site config user.email "johnschwinghamer94@gmail.com"
          git -C site config user.name "John Schwinghamer"
          python auto_update_dashboard.py
      - name: Audit — published dashboard vs your emailed reports (freshness-tolerant)
        continue-on-error: true          # a DRIFT flags the step red but never reverts the build
        env:
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_REFRESH_TOKEN: ${{ secrets.GRAPH_REFRESH_TOKEN }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          AUDIT_FRESH: "6"               # per-tech count allowance; 5%/$50k on money
        run: |
          # Your emailed reports refresh ~daily, so audit vs them once a day (14:00 UTC ≈ 7 AM
          # Pacific, after the morning reports land) — plus on any manual run. Other hourly
          # rebuilds skip this to avoid hammering the Graph API.
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$(date -u +%H)" != "14" ]; then
            echo "hourly rebuild — daily report audit runs at 14:00 UTC only; skipping this hour"
            exit 0
          fi
          # Recount from YOUR emailed Excel reports and diff against the published (API-fed) index.html.
          # If the emailed reports can't be downloaded, audit_dashboard.py compares the
          # published dashboard against whatever stale Excel is already on the runner (or
          # nothing) — a PASS then means nothing at all. That false all-clear is worse than
          # a red step, so surface it. The audit still runs for whatever signal it gives.
          dl_ok=1
          python graph_download_cloud.py \
            || { echo "::error::could not download your emailed Excel reports — the audit below is comparing the dashboard against STALE (or missing) report files, so a clean result does NOT mean the published numbers agree with your reports"; dl_ok=0; }
          python audit_dashboard.py --index site/index.html
          [ "$dl_ok" = "1" ] || exit 1
