name: SILO Live Feed (cloud)
on:
  schedule:
    # PT = UTC-7. Dense 6:50-9a start window (GitHub skips single ticks),
    # then re-arm every 2 h through 9 pm. concurrency keeps one active
    # session + one queued, so extra ticks collapse harmlessly.
    - cron: "30,35,45 12 * * *"   # 5:30a PT day start (John 7/31)
    - cron: "0,15,30 13 * * *"
    - cron: "50,55 13 * * *"
    - cron: "0,15,30,45 14,15 * * *"
    - cron: "0 16,18,20,22,0,2,4 * * *"
    # 0 6 * * * = 11 PM PT — extended to midnight 2026-07-26 (John): a session
    # can start late evening even if none is already running, so late-typed
    # TGL tickets still land on that day's live board.
    - cron: "0 6 * * *"
  workflow_dispatch:
concurrency:
  group: livefeed
  cancel-in-progress: false
jobs:
  livefeed:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet -r requirements.txt
      - run: python preflight_check.py
      - env:
          ST_CREDS_JSON: ${{ secrets.ST_CREDS_JSON }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          SHEET_WEBHOOK: ${{ secrets.SHEET_WEBHOOK }}
          SIRO_API_KEY: ${{ secrets.SIRO_API_KEY }}
          SIRO_CLIENT_ID: ${{ secrets.SIRO_CLIENT_ID }}
          SIRO_CLIENT_SECRET: ${{ secrets.SIRO_CLIENT_SECRET }}
          SIRO_USER_ID: ${{ secrets.SIRO_USER_ID }}
          LIVEFEED_CLOUD: "1"
          RELAY_SELF_UPDATE: "1"
        run: python livefeed_sync.py
