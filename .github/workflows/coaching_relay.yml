name: "Coaching relay (plans → dashboard)"
on:
  push:
    paths:
      - "plans/**"
      - "coaching.json"
      - "plans_service/**"
      - "service_coaching.json"
      - "weekly/**"
      - "monthly/**"
      - "objections/**"
  workflow_dispatch:
concurrency:
  group: coaching-relay
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4          # engine (this repo)
      - uses: actions/checkout@v4          # live site (public repo) — where the coaching feed is published
        with:
          repository: johnschwinghamer94-lab/sierra-ropp-dashboard
          token: ${{ secrets.DASHBOARD_TOKEN }}
          persist-credentials: true
          path: site
      - name: Relay coaching.json, plans, and weekly rollups to the site
        run: |
          if [ ! -f coaching.json ] && [ ! -f service_coaching.json ]; then
            echo "No coaching.json or service_coaching.json in this repo — nothing to relay."
            exit 0
          fi

          if [ -f coaching.json ]; then
            cp coaching.json site/coaching.json
          fi
          mkdir -p site/coaching/plans
          if [ -d plans ]; then
            for d in plans/*/; do
              [ -d "$d" ] || continue
              date_name=$(basename "$d")
              mkdir -p "site/coaching/plans/$date_name"
              rsync -a "$d" "site/coaching/plans/$date_name/"
            done
          fi

          if [ -f service_coaching.json ]; then
            cp service_coaching.json site/service_coaching.json
          fi
          mkdir -p site/coaching/plans_service
          if [ -d plans_service ]; then
            for d in plans_service/*/; do
              [ -d "$d" ] || continue
              date_name=$(basename "$d")
              mkdir -p "site/coaching/plans_service/$date_name"
              rsync -a "$d" "site/coaching/plans_service/$date_name/"
            done
          fi

          mkdir -p site/coaching/weekly
          if [ -d weekly ]; then
            for d in weekly/*/; do
              [ -d "$d" ] || continue
              folder_name=$(basename "$d")
              mkdir -p "site/coaching/weekly/$folder_name"
              rsync -a "$d" "site/coaching/weekly/$folder_name/"
            done
          fi

          mkdir -p site/coaching/monthly
          if [ -d monthly ]; then
            for d in monthly/*/; do
              [ -d "$d" ] || continue
              folder_name=$(basename "$d")
              mkdir -p "site/coaching/monthly/$folder_name"
              rsync -a "$d" "site/coaching/monthly/$folder_name/"
            done
          fi

          mkdir -p site/coaching/objections
          if [ -d objections ]; then
            # Mirror, don't just copy: a month file deleted upstream (e.g. the
            # 2026-07-27 miscalibrated-pass reset) must also disappear from the
            # site, or summary.json and the month files drift out of sync.
            rsync -a --delete --include='*.json' --exclude='*' objections/ site/coaching/objections/
          fi

          cd site
          git config user.name "coaching-relay"
          git config user.email "actions@github.com"
          paths=""
          for p in coaching.json coaching/plans service_coaching.json coaching/plans_service coaching/weekly coaching/monthly coaching/objections; do
            [ -e "$p" ] && { git add "$p"; paths="$paths $p"; }
          done
          if git diff --cached --quiet; then
            echo "No staged changes — nothing to commit."
            exit 0
          fi
          git commit -q -m "Coaching plans relay $(date +%F)"
          # The site copies are pure MIRRORS of this repo's plans/weekly/monthly/objections,
          # so on a push race ours win outright. The old `pull --rebase; push` aborted on
          # any conflict and the relay was simply lost until someone pushed to plans/**
          # again. --mixed (not --soft) keeps every other site change — index.html is
          # rewritten by the hourly rebuild while this job runs.
          n=0
          until git push -q origin HEAD:main; do
            n=$((n+1))
            if [ "$n" -gt 5 ]; then
              echo "::error::coaching relay push failed after 5 attempts — the new coaching plans / weekly rollups are NOT on the dashboard; the site is still showing the previous relay"
              exit 1
            fi
            git fetch -q origin main
            git reset -q --mixed origin/main
            for p in $paths; do git add "$p"; done
            if git diff --cached --quiet; then echo "site already current"; break; fi
            git commit -q -m "Coaching plans relay $(date +%F)"
          done
