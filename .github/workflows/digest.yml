name: Morning digest

on:
  schedule:
    - cron: "30 13 * * *"   # 6:30 AM PDT (America/Los_Angeles); UTC cron does not
                             # shift for DST, so this runs 5:30 AM during PST.
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --quiet -r requirements.txt
      - name: Build + publish morning digest (fails loudly — no continue-on-error, no masking)
        run: python morning_digest.py
