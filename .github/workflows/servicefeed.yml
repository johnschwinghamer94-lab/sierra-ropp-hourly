name: Service Live Feed (cloud)
on:
  schedule:
    # PT = UTC-7. Dense 6:50-9a start window (GitHub skips single ticks),
    # then re-arm every 2 h through midnight. concurrency keeps one active
    # session + one queued, so extra ticks collapse harmlessly.
    - cron: "50,55 13 * * *"
    - cron: "0,15,30,45 14,15 * * *"
    - cron: "0 16,18,20,22,0,2,4 * * *"
    # 0 6 * * * = 11 PM PT — session can start late evening even if none is
    # already running, so late-typed tickets still land on that day's board.
    - cron: "0 6 * * *"
  workflow_dispatch:
concurrency:
  group: servicefeed
  cancel-in-progress: false
jobs:
  servicefeed:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet -r requirements.txt
      - env:
          ST_CREDS_JSON: ${{ secrets.ST_CREDS_JSON }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          SERVICEFEED_CLOUD: "1"
        run: python servicefeed_sync.py
